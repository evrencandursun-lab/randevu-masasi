<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Randevu Masası</title><meta name="description" content="Randevunuzu tek dokunuşla yanıtlayın: Geleceğim · Başka gün · Gelemeyeceğim"><meta name="theme-color" content="#0F7A73"><meta property="og:type" content="website"><meta property="og:site_name" content="Randevu Masası"><meta property="og:title" content="Randevunuzu yanıtlayın"><meta property="og:description" content="Geleceğim · Başka bir gün · Gelemeyeceğim — tek dokunuşla"><meta property="og:image" content="https://randevu-masasi.web.app/onay.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%230F7A73%22/%3E%3Cpath d=%22M7 6c-1.6 0-2.8 1.3-2.8 3.2 0 2.4 1.2 3.2 1.6 5.6.4 2.4.8 5.2 2 5.2s1.2-3.2 2.4-3.2 1.2 3.2 2.4 3.2 1.6-3.2 2-5.6c.4-2.4 1.6-3.2 1.6-5.6C16.2 7.3 15 6 13.4 6c-1.4 0-2 .8-3.2.8S8.4 6 7 6z%22 fill=%22white%22/%3E%3C/svg%3E"></head><body>
<title>Randevu Masası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* Layout: klinik masası — üstte bölüm çubuğu (telefonda altta), içerikte kartlar; hasta kartı kendi alt sekmeleriyle tam sayfa */
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --surface2:#E9F0EF; --line:#D5E0DF;
  --fg:#14201F; --muted:#4D5C5B; --brand:#0B5B60; --brand-ink:#FFFFFF; --brand-soft:#D9ECEB;
  --wa:#0E7A43; --wa-soft:#DDF2E6; --warn:#8A5200; --warn-soft:#FBEBD2; --bad:#B42318; --bad-soft:#FBE3E0;
  --info:#1D4ED8; --info-soft:#E0E9FD; --vio:#6D28D9; --vio-soft:#EEE6FD;
  --h1:#0B5B60; --h2:#C2410C; --h3:#1D4ED8; --h4:#7E22CE; --h5:#A16207; --h6:#BE185D;
  --tooth:#FFFFFF; --tooth-line:#A9BAB8;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1615; --surface:#162120; --surface2:#1E2C2B; --line:#2B3B3A;
  --fg:#E6EFEE; --muted:#A3B5B3; --brand:#5CC3BC; --brand-ink:#06201F; --brand-soft:#173B3A;
  --wa:#4CD18A; --wa-soft:#163527; --warn:#F2B663; --warn-soft:#3A2A12; --bad:#F38B80; --bad-soft:#3E1C19;
  --info:#93B4FF; --info-soft:#1B2A4A; --vio:#C4A8FF; --vio-soft:#2C2147;
  --h1:#5CC3BC; --h2:#FB923C; --h3:#93B4FF; --h4:#D8B4FE; --h5:#FACC15; --h6:#F9A8D4;
  --tooth:#22302F; --tooth-line:#4A5E5C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1615; --surface:#162120; --surface2:#1E2C2B; --line:#2B3B3A;
  --fg:#E6EFEE; --muted:#A3B5B3; --brand:#5CC3BC; --brand-ink:#06201F; --brand-soft:#173B3A;
  --wa:#4CD18A; --wa-soft:#163527; --warn:#F2B663; --warn-soft:#3A2A12; --bad:#F38B80; --bad-soft:#3E1C19;
  --info:#93B4FF; --info-soft:#1B2A4A; --vio:#C4A8FF; --vio-soft:#2C2147;
  --h1:#5CC3BC; --h2:#FB923C; --h3:#93B4FF; --h4:#D8B4FE; --h5:#FACC15; --h6:#F9A8D4;
  --tooth:#22302F; --tooth-line:#4A5E5C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-right:auto;min-width:0}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center;flex:none}
.nav{display:flex;gap:4px}
.nav button{border:0;background:transparent;padding:10px 12px;border-radius:10px;min-height:44px;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--muted);font-weight:600;position:relative}
.nav button.on{background:var(--brand-soft);color:var(--fg)}
.nav .badge{background:var(--bad);color:#fff;font-size:11px;border-radius:99px;padding:1px 6px;font-weight:700}
@media (max-width:719px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1}
  .nav .badge{position:absolute;top:2px;right:calc(50% - 22px)}
  main{padding-bottom:96px}
}
main{padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
.demo{background:var(--warn-soft);border-radius:var(--r);padding:10px 14px;font-size:13px}
.demo b{color:var(--warn)}
h1{font-size:22px;margin:0;text-wrap:balance;font-weight:700}
h2{font-size:16px;margin:0;font-weight:700}
h3{font-size:15px;margin:0;font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daybar h1{flex:1;min-width:150px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.wa{background:var(--wa-soft);color:var(--wa);border-color:transparent}
.btn.bad{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.icon{width:44px;padding:0}
.btn[aria-disabled="true"],.btn:disabled{opacity:.55;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:9px;padding:8px 10px;min-height:44px;font-weight:600;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.cols.multi{grid-template-columns:repeat(var(--n),minmax(0,1fr))}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.colhead{display:flex;align-items:center;gap:8px;font-weight:700;padding:4px 2px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px}
.card .t{font-family:var(--f-mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;grid-row:span 2;padding-top:2px}
.card .t small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.card .who{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-width:0}
.card .who strong{font-size:16px}
.card .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.card.one{grid-template-columns:minmax(0,1fr)}
.card.done{opacity:.7}
.card.miss .who strong{text-decoration:line-through;text-decoration-thickness:2px}
.linkish{background:none;border:0;padding:0;font-weight:700;font-size:16px;cursor:pointer;color:var(--fg);text-align:left;min-height:32px}
.linkish:hover{text-decoration:underline}
.sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--surface2);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.bad{white-space:normal;max-width:100%}
.pill.ok{background:var(--wa-soft);color:var(--wa)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.vio{background:var(--vio-soft);color:var(--vio)}
.chip{border:0;cursor:pointer;font-weight:700;font-size:13px;border-radius:99px;padding:0 12px 0 6px;min-height:44px;display:inline-flex;align-items:center;gap:6px;background:var(--surface2);color:var(--fg)}
.chip .g{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-family:var(--f-mono);background:var(--surface);border:1.5px solid currentColor}
.chip.s-bekliyor{color:var(--muted)}
.chip.s-onaylandi{background:var(--info-soft);color:var(--info)}
.chip.s-geldi{background:var(--warn-soft);color:var(--warn)}
.chip.s-koltukta{background:var(--vio-soft);color:var(--vio)}
.chip.s-cikti{background:var(--wa-soft);color:var(--wa)}
.chip.s-gelmedi{background:var(--bad-soft);color:var(--bad)}
.chip.s-cikti .g{background:var(--wa);border-color:var(--wa);color:var(--surface)}
.chip.s-gelmedi .g{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.chip[disabled]{cursor:default}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{font-family:var(--f-mono);font-size:14px;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:6px 10px;min-height:44px;cursor:pointer;color:var(--fg)}
.slot:hover{border-color:var(--brand);border-style:solid}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.note{font-size:13px;color:var(--muted);margin:0;max-width:72ch}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{font-size:16px;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
label.f textarea{min-height:80px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chk input{width:22px;height:22px;margin-top:1px;accent-color:var(--brand);flex:none}
.chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-weight:700;font-size:14px;padding:0 6px}
.ov{position:fixed;inset:0;background:rgba(5,15,15,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.ov{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:580px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet.wide{max-width:900px}
@media (min-width:720px){.sheet{border-radius:18px}}
.sheet header{display:flex;align-items:center;gap:8px}
.sheet header h2{flex:1}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{justify-content:flex-start}
.warnbox{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.infobox{background:var(--info-soft);color:var(--fg);border-radius:10px;padding:8px 12px;font-size:13px}
.alert{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:700;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
@media (min-width:720px){.toast{bottom:24px}}
.search{width:100%;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.hist{display:flex;flex-direction:column;font-size:14px}
.hist div{display:flex;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line);padding-block:7px;flex-wrap:wrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center}
.tablebox{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
table.t th{background:var(--surface2);text-align:left;padding:10px 12px;font-size:13px}
table.t td{border-top:1px solid var(--line);padding:8px 12px;vertical-align:middle}
table.t tfoot td{font-weight:700}
/* hasta kartı */
.phead{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.phead .nm{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
/* odontogram */
.odo{position:relative;display:flex;flex-direction:column;gap:6px;overflow-x:auto;padding-bottom:4px}
.jaw{display:grid;grid-template-columns:repeat(16,minmax(40px,1fr));gap:4px;min-width:700px}
.jaw.sut{grid-template-columns:repeat(10,minmax(44px,1fr));min-width:480px;max-width:640px;margin-inline:auto}
.mid{border-top:2px dashed var(--line);margin:4px 0;min-width:700px}
.tooth{border:1.5px solid var(--tooth-line);background:var(--tooth);border-radius:10px 10px 14px 14px;min-height:64px;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px;color:var(--fg);position:relative}
.jaw.low .tooth{border-radius:14px 14px 10px 10px}
.tooth .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:600}
.tooth .ab{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.tooth .ab span{font-size:10px;font-weight:700;border-radius:4px;padding:1px 3px;color:#fff;line-height:1.2}
.tooth.eksik{border-style:dashed;opacity:.6;background:transparent}
.tooth.sel{outline:3px solid var(--brand);outline-offset:1px}
.tooth .pl{position:absolute;top:-6px;right:-4px;background:var(--warn);color:var(--surface);font-size:10px;font-weight:700;border-radius:99px;padding:0 5px}
/* röntgen */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;cursor:pointer;padding:0;display:flex;flex-direction:column;text-align:left}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;max-width:100%}
.thumb span{background:var(--surface);color:var(--fg);padding:6px 8px;font-size:12px;display:block}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.viewer{background:#000;border-radius:10px;overflow:auto;max-height:60vh;display:flex;justify-content:center;align-items:flex-start}
.viewer img{max-width:none;transform-origin:top center}
input[type=range]{width:100%;accent-color:var(--brand);min-height:32px}
/* imza */
.sig{border:1.5px dashed var(--tooth-line);border-radius:10px;background:#fff;touch-action:none;width:100%;height:160px;display:block;cursor:crosshair}
/* belge önizleme */
.docbox{background:var(--surface2);border-radius:10px;padding:12px;overflow:auto;max-height:62vh}
.docbox .doc{box-shadow:0 2px 10px rgba(0,0,0,.15);margin-inline:auto;-webkit-text-size-adjust:none;text-size-adjust:none}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
/* grafik renkleri: dataviz doğrulayıcısından geçti (açık #2a78d6/#eb6834, koyu #3987e5/#d95926) */
:root{--s1:#2a78d6;--s2:#eb6834;--grid:#E3EAE9;--axis:#4D5C5B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--grid:#253433;--axis:#A3B5B3}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--grid:#253433;--axis:#A3B5B3}
.stats.s6{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.stats.s6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:14px}
.viz{position:relative;min-width:0}
.viz svg{display:block;width:100%;height:auto}
.viz .hit{fill:transparent;cursor:crosshair;outline:none}
.viz .hit:focus-visible{fill:var(--brand-soft);fill-opacity:.5}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;z-index:5;transform:translate(-50%,calc(-100% - 10px));font-variant-numeric:tabular-nums;width:max-content;max-width:240px}
details.tbl summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);min-height:36px;display:flex;align-items:center}
.week{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.wgrid{display:grid;grid-template-columns:52px repeat(7,minmax(110px,1fr));min-width:830px}
.wh{background:var(--surface2);padding:8px 6px;font-size:13px;font-weight:700;text-align:center;border-bottom:1px solid var(--line);color:var(--fg)}
.wh.today{color:var(--brand)}
.wcol{position:relative;border-left:1px solid var(--line)}
.wtime{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.wb{position:absolute;border-radius:8px;padding:3px 6px;font-size:12px;overflow:hidden;cursor:pointer;border:1px solid var(--line);text-align:left;color:var(--fg);background:var(--surface2);display:block}
.wb b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb.miss b{text-decoration:line-through}
.qty{display:inline-flex;align-items:center;gap:6px}
:root{--crown:#FBF8F0;--root:#EADFC8;--tstroke:#8C8273}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--crown:#E6DFCF;--root:#B9AD94;--tstroke:#4F483D}}
:root[data-theme="dark"]{--crown:#E6DFCF;--root:#B9AD94;--tstroke:#4F483D}

const IDB={db:null,
  open(){return this.db||(this.db=new Promise((res,rej)=>{try{const r=indexedDB.open('randevuMasasiImg',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('img'))d.createObjectStore('img');if(!d.objectStoreNames.contains('veri'))d.createObjectStore('veri')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))},
  async tx(mode,fn,st){st=st||'img';const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction(st,mode);const s=t.objectStore(st);const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  put(k,v){return this.tx('readwrite',s=>s.put(v,k))},get(k){return this.tx('readonly',s=>s.get(k))},del(k){return this.tx('readwrite',s=>s.delete(k))},
  vput(k,v){return this.tx('readwrite',s=>s.put(v,k),'veri')},vget(k){return this.tx('readonly',s=>s.get(k),'veri')}};

const hatPill=r=>r.hat?`<span class="pill ${HAT[r.hat][1]}">${HAT[r.hat][0]}</span>`:(r.durum==='bekliyor'&&r.tarih>=TODAY?'<span class="pill warn">Hatırlatılmadı</span>':'');
const riskPill=k=>{const {alerji,riskler:rs}=riskler(k);return (alerji?`<span class="pill bad" title="Alerji">⚠ Alerji: ${esc(alerji)}</span>`:'')+(rs.length?`<span class="pill bad">⚠ ${esc(rs[0])}${rs.length>1?' +'+(rs.length-1):''}</span>`:'')};
function selam(){const h=new Date().getHours(),u=typeof aktifKul==='function'&&aktifKul();const sz=h<5?'İyi geceler':h<11?'Günaydın':h<17?'İyi günler':h<22?'İyi akşamlar':'İyi geceler';return sz+(u&&u.ad?', '+esc(String(u.ad).split(' ')[0]):'')}
function ornekAyarVar(){const a=S.ayar;return a.hekimler.some(h=>/^Dt\. Hekim [AB]$/.test(h))||/^\[.*\]$/.test(String(a.adres).trim())||/^\[.*\]$/.test(String(a.telefon).trim())||(a.labFirmalar||[]).some(x=>/^Örnek /.test(x))}

function demoBant0(){if(!S.ornek&&ornekAyarVar())return`<div class="warnbox" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:200px"><b>Bazı ayarlar hâlâ örnek:</b> ${esc([S.ayar.hekimler.some(h=>/^Dt\. Hekim [AB]$/.test(h))?'hekim adları ('+S.ayar.hekimler.filter(h=>/^Dt\. Hekim [AB]$/.test(h)).join(', ')+')':'',/^\[/.test(String(S.ayar.adres).trim())?'adres':'',/^\[/.test(String(S.ayar.telefon).trim())?'telefon':'',(S.ayar.labFirmalar||[]).some(x=>/^Örnek /.test(x))?'laboratuvar adları':''].filter(Boolean).join(', '))}. Çıktılarda bunlar görünür.</span><button class="btn sm" data-a="ayarGit">Ayarlar'da düzelt</button></div>`;return S.ornek?`<div class="demo"><span><b>Deneme sürümü, örnek veriler.</b> Kişiler, numaralar ve fiyatlar uydurmadır. Gerçek hasta bilgisi girmeden önce Ayarlar'dan örnek kayıtları silin.</span></div>`:''}

/* ---------- Gün ---------- */
function kart(r){
  const k=kisi(r.kisiId),bit=toT(toMin(r.saat)+Number(r.sure));
  const cls=r.durum==='cikti'?'done':r.durum==='gelmedi'?'miss done':'';

  return `<article class="card ${cls}">
    <div class="t">${esc(r.saat)}<small>${bit}</small></div>
    <div class="who"><button class="linkish" data-a="hastaAc" data-id="${r.kisiId}"><strong>${esc(k.ad)}</strong></button>${chip(r)}</div>
    <div class="sub"><span><span class="dot" style="background:${renk(r.hekim)}" aria-hidden="true"></span> ${esc(r.hekim)}</span><span>${r.sure} dk</span><span class="mono">${esc(telGoster(k.tel))}</span>${hatPill(r)}${r.erken?'<span class="pill">Erken ister</span>':''}${riskPill(k)}${gmPill(k)}</div>
    <div class="acts">
      ${hatirlatilabilir?waBtn(waLink(k.tel,hatMesaj(r,k)),'Hatırlat',`data-a="hatGonder" data-id="${r.id}"`):''}
      ${['koltukta','cikti'].includes(r.durum)&&r.tarih===TODAY?`<button class="btn sm ${r.durum==='cikti'&&kalan(k)>0.009?'pri':''}" data-a="tahsilat" data-k="${k.id}">Tahsilat al${kalan(k)>0.009?' · '+TL(kalan(k)):''}</button>`:''}
      <button class="btn sm" data-a="hastaAc" data-id="${r.kisiId}">Hasta kartı</button>${S.ayar.entegrasyon.takvim.mod!=='kapali'&&aktif(r)&&r.durum!=='cikti'&&r.tarih>=TODAY?`<a class="btn sm" href="${esc(TKV.link(r,false))}" target="_blank" rel="noopener" aria-label="${esc(k.ad)} randevusunu Google Takvim'e ekle">${r.gcal?'✓ Takvimde':'+ Takvim'}</a>`:''}
      <button class="btn sm icon" data-a="menu" data-id="${r.id}" aria-label="${esc(k.ad)} randevusu için diğer işlemler">${ico.more}</button>
    </div></article>`;
}
function vGun(){
  if(U.gorunum==='hafta')return vHafta();
  const g=U.gun,tum=sirala(S.randevular.filter(r=>r.tarih===g&&r.durum!=='iptal'));
  const H=S.ayar.hekimler,sec=U.hekim==='*'||!H.includes(U.hekim)?H:[U.hekim];
  const rel=g===TODAY?'Bugün':g===addDays(TODAY,1)?'Yarın':g===addDays(TODAY,-1)?'Dün':'';
  const say=f=>tum.filter(f).length;
  let h=demoBant()+(g===TODAY?`<p class="selam">${selam()}</p>`:'')+`<div class="daybar">
    <button class="btn icon" data-a="gun" data-d="-1" aria-label="Önceki gün">${ico.back}</button>
    <h1>${rel?`<span class="muted" style="font-weight:600">${rel} · </span>`:''}${esc(uzun(g))}</h1>
    <button class="btn icon" data-a="gun" data-d="1" aria-label="Sonraki gün"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <label class="f" for="gunSec" style="flex-direction:row"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Tarihe git</span><input id="gunSec" type="date" value="${g}" style="width:auto"></label>
    ${g!==TODAY?'<button class="btn sm" data-a="gun" data-d="0">Bugün</button>':''}
    <button class="btn pri" data-a="yeni">+ Randevu</button>
  </div>${gorunumSeg()}
  <div class="stats">
    <div class="stat"><b>${say(r=>r.durum!=='gelmedi')}</b><span>randevu</span></div>
    <div class="stat"><b>${say(r=>r.durum==='onaylandi'||ZINCIR.indexOf(r.durum)>1)}</b><span>onaylı / geldi</span></div>
    <div class="stat"><b style="color:${say(r=>r.durum==='bekliyor')?'var(--warn)':'inherit'}">${say(r=>r.durum==='bekliyor')}</b><span>onay bekliyor</span></div>
    <div class="stat"><b>${TL((S.kisiler.flatMap(k=>k.tahsilat||[]).filter(t=>t.tarih===g)).reduce((s,t)=>s+t.tutar,0))}</b><span>günün tahsilatı</span></div>
  </div>`;
  if(g===TODAY)h+=otoPanel();
  if(H.length>1)h+=`<div class="seg" role="group" aria-label="Hekim seçimi"><button class="${U.hekim==='*'?'on':''}" data-a="hekim" data-v="*">Tüm hekimler</button>${H.map(x=>`<button class="${U.hekim===x?'on':''}" data-a="hekim" data-v="${esc(x)}"><span class="dot" style="background:${renk(x)}" aria-hidden="true"></span>${esc(x)}</button>`).join('')}</div>`;
  h+=`<div class="legend" aria-label="Durum anahtarı">${ZINCIR.map(z=>`<span><b class="mono">${DURUM[z][1]}</b> ${DURUM[z][0]}</span>`).join('<span aria-hidden="true">→</span>')}<span>· Gelmedi ve İptal ⋯ menüsünden</span></div>`;
  h+=`<div class="cols ${sec.length>1?'multi':''}" style="--n:${sec.length}">`+sec.map(he=>{
    const list=tum.filter(r=>r.hekim===he);const bos=g>=TODAY?bosSaatler(g,he):[];
    return `<section class="col" aria-label="${esc(he)}">
      ${H.length>1?`<div class="colhead"><span class="dot" style="background:${renk(he)}" aria-hidden="true"></span>${esc(he)}<span class="muted" style="font-weight:500">· ${list.filter(r=>r.durum!=='gelmedi').length} randevu</span></div>`:''}
      ${list.length?'<div class="list">'+list.map(kart).join('')+'</div>':'<div class="empty">Bu hekimin bu güne randevusu yok.</div>'}
      ${g>=TODAY?`<div class="panel"><h2>Boş saatler <span class="muted" style="font-weight:500">(${bos.length})</span></h2><div class="slots">${bos.length?bos.map(t=>`<button class="slot" data-a="yeni" data-saat="${t}" data-hekim="${esc(he)}" aria-label="${t} ${esc(he)} için randevu ekle">${t}</button>`).join(''):'<span class="muted">Gün dolu.</span>'}</div></div>`:''}
    </section>`}).join('')+'</div>';
  return h;
}

    return h+'<div class="list">'+o.map(r=>{const kk=kisi(r.kisiId);return `<article class="card"><div class="t">${esc(r.saat)}<small>${r.sure} dk</small></div>
      <div class="who"><strong>${esc(kk.ad)}</strong>${chip(r)}${hatPill(r)}</div>
      <div class="sub"><span><span class="dot" style="background:${renk(r.hekim)}" aria-hidden="true"></span> ${esc(r.hekim)}</span><span class="mono">${esc(telGoster(kk.tel))}</span></div>
      <div class="acts">${waBtn(waLink(kk.tel,hatMesaj(r,kk)),r.hat?'Tekrar gönder':'WhatsApp ile hatırlat',`data-a="hatGonder" data-id="${r.id}"`)}
      ${r.durum==='bekliyor'?`<button class="btn sm" data-a="onayla" data-id="${r.id}">Onayladı</button><button class="btn sm" data-a="hatSonuc" data-v="yanityok" data-id="${r.id}">Yanıt yok</button><button class="btn sm" data-a="hatSonuc" data-v="ulasilamadi" data-id="${r.id}">Ulaşılamadı</button>`:''}

/* ---------- Hastalar ---------- */
function vHastalar(){
  if(U.hasta&&S.kisiler.find(k=>k.id===U.hasta))return vHasta(kisi(U.hasta));
  const q=U.ara.toLocaleLowerCase('tr'),qd=U.ara.replace(/\D/g,'');
  const list=S.kisiler.filter(k=>!q||k.ad.toLocaleLowerCase('tr').includes(q)||(qd&&String(k.tel).replace(/\D/g,'').includes(qd))).filter(k=>U.hFiltre==='borclu'?kalan(k)>0.009:U.hFiltre==='yakin'?(n=>n&&n.tarih<=addDays(TODAY,1))(sonraki(k.id)):U.hFiltre==='risk'?(x=>x.alerji||x.riskler.length)(riskler(k)):true)
    .sort(U.hFiltre==='borclu'?(a,b)=>kalan(b)-kalan(a):U.hFiltre==='yakin'?(a,b)=>(sonraki(a.id).tarih+sonraki(a.id).saat).localeCompare(sonraki(b.id).tarih+sonraki(b.id).saat):(a,b)=>a.ad.localeCompare(b.ad,'tr'));
  const fb=(v,t)=>`<button class="${U.hFiltre===v?'on':''}" data-a="hfiltre" data-v="${v}" aria-pressed="${U.hFiltre===v}">${t}</button>`;
  let h=demoBant()+`<div class="row"><h1 style="flex:1">Hastalar <span class="muted" style="font-weight:500">(${S.kisiler.length})</span></h1><button class="btn pri" data-a="kisiYeni">+ Hasta</button></div>
  <label class="f" for="ara">Ad veya telefonla ara<input class="search" id="ara" type="search" value="${esc(U.ara)}" placeholder="Örn. Ayşe ya da 0532" autocomplete="off"></label>
  <div class="seg" role="group" aria-label="Hasta filtresi">${fb('tum','Tümü')}${fb('yakin','Bugün / yarın gelecek')}${fb('borclu','Borcu olan')}${fb('risk','Alerji / risk')}</div>`;
  if(!list.length)return h+'<div class="empty">Eşleşen hasta yok.</div>';
  const kalanSay=list.length-U.hLimit;
  return h+`<p class="muted" style="margin:0;font-size:13px">${list.length} hasta${U.hFiltre==='borclu'?' · toplam alacak '+TL(sum(list.map(k=>kalan(k)))):''}</p>`+'<div class="list">'+list.slice(0,U.hLimit).map(k=>{const n=sonraki(k.id),kl=kalan(k);return `<button class="card av" data-a="hastaAc" data-id="${k.id}" style="text-align:left;cursor:pointer;width:100%"><span class="avatar" aria-hidden="true" style="--av:${avRenk(k.ad)}">${esc(basH(k.ad))}</span>
    <span class="who"><strong>${esc(k.ad)}</strong>${k.dogum?`<span class="muted" style="font-size:13px">${yas(k.dogum)} yaş</span>`:''}${riskPill(k)}${kl>0.009?`<span class="pill warn">Kalan ${TL(kl)}</span>`:''}</span>
    <span class="sub"><span class="mono">${esc(telGoster(k.tel))}</span><span>Son geliş: ${kisaYil(sonGelis(k.id))}</span><span>Sonraki: ${n?kisa(n.tarih)+' '+n.saat:'—'}</span></span></button>`}).join('')+'</div>'+(kalanSay>0?`<div class="row" style="justify-content:center"><button class="btn" data-a="hDaha">${Math.min(50,kalanSay)} hasta daha göster (${kalanSay} kaldı)</button></div>`:'');
}
function vHasta(k){
  const {alerji,riskler:rs}=riskler(k);const n=sonraki(k.id);
  const sb=(v,t)=>`<button role="tab" aria-selected="${U.hseg===v}" class="${U.hseg===v?'on':''}" data-a="hseg" data-v="${v}">${t}</button>`;
  let h=`<div class="phead"><button class="btn icon" data-a="hastaKapat" aria-label="Hasta listesine dön">${ico.back}</button>
    <div class="nm"><h1>${esc(k.ad)}</h1><div class="sub"><span class="mono">${esc(telGoster(k.tel))}</span>${k.dogum?`<span>${tamTarih(k.dogum)} · ${yas(k.dogum)} yaş</span>`:''}<span>Sonraki randevu: ${n?kisa(n.tarih)+' '+n.saat:'—'}</span>${gmPill(k)}${k.kaynak?`<span>Kaynak: ${esc(k.kaynak)}</span>`:''}</div></div>

const docCss='font-family:Figtree,Arial,sans-serif;color:#111;background:#fff;width:794px;min-height:1123px;padding:56px 64px;box-sizing:border-box;font-size:13px;line-height:1.55';
function docHead(baslik,no){return `<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #0B5B60;padding-bottom:14px;margin-bottom:22px;gap:20px"><div><div style="font-size:20px;font-weight:700;color:#0B5B60">${esc(S.ayar.klinik)}</div><div style="color:#444">${esc(S.ayar.adres)}<br>${esc(S.ayar.telefon)}</div></div><div style="text-align:right"><div style="font-size:17px;font-weight:700">${esc(baslik)}</div>${no?`<div style="color:#444">No: ${esc(no)}</div>`:''}<div style="color:#444">Düzenleme: ${tamTarih(TODAY)}</div></div></div>`}
function docHasta(k){return `<table style="width:100%;border-collapse:collapse;margin-bottom:18px;font-size:13px"><tr><td style="padding:4px 0;width:140px;color:#444">Hasta adı soyadı</td><td style="padding:4px 0;font-weight:700">${esc(k.ad)}</td><td style="padding:4px 0;width:110px;color:#444">Doğum tarihi</td><td style="padding:4px 0">${k.dogum?tamTarih(k.dogum):'—'}</td></tr><tr><td style="padding:4px 0;color:#444">Telefon</td><td style="padding:4px 0">${esc(telGoster(k.tel))}</td><td></td><td></td></tr></table>`}
const imzaKutu=(ust,img)=>`<div style="flex:1;min-width:220px"><div style="height:80px;border-bottom:1px solid #333;display:flex;align-items:flex-end">${img?`<img src="${img}" alt="" style="max-height:78px;max-width:100%">`:''}</div><div style="color:#444;margin-top:6px">${ust}</div></div>`;
const tbl=(head,rows,foot)=>`<table style="width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 18px"><thead><tr>${head.map((h,i)=>`<th style="text-align:${i>=head.length-1?'right':'left'};border-bottom:1.5px solid #333;padding:6px 6px">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr data-blok>${r.map((c,i)=>`<td style="border-bottom:1px solid #ddd;padding:6px;text-align:${i>=r.length-1?'right':'left'}">${c}</td>`).join('')}</tr>`).join('')}</tbody>${foot?`<tfoot><tr>${foot.map((c,i)=>`<td style="padding:8px 6px;font-weight:700;text-align:${i>=foot.length-1?'right':'left'}">${c}</td>`).join('')}</tr></tfoot>`:''}</table>`;
function belgeHTML(tur,k,id){
  if(tur==='onam'){const o=k.onamlar.find(x=>x.id===id);
    return {ad:`Onam-${k.ad}-${o.tarih}`,html:`<div style="${docCss}">${docHead(o.baslik)}${docHasta(k)}<div style="margin-bottom:6px"><b>İşlem:</b> ${esc(o.islem||'—')}${o.dis?` &nbsp; <b>Diş/bölge:</b> ${esc(o.dis)}`:''} &nbsp; <b>Hekim:</b> ${esc(o.hekim)} &nbsp; <b>Tarih:</b> ${tamTarih(o.tarih)}</div>
    ${o.metin.split(/\n\s*\n/).map(p=>`<p data-blok style="margin:12px 0;text-align:justify">${esc(p)}</p>`).join('')}
    <p style="margin:18px 0;font-weight:700">Yukarıdaki bilgileri okudum, anladım. Tedavinin yapılmasını kendi özgür irademle kabul ediyorum.</p>
    <div data-blok style="display:flex;gap:40px;margin-top:30px;flex-wrap:wrap">${imzaKutu('Hasta (veya yasal temsilcisi) imzası<br>'+esc(k.ad),o.imza)}${imzaKutu('Hekim imzası<br>'+esc(o.hekim),'')}</div></div>`}}
  if(tur==='plan'){const t=planToplam(k);
    return {ad:`Tedavi-plani-${k.ad}`,html:`<div style="${docCss}">${docHead('Tedavi Planı ve Ücret Teklifi')}${docHasta(k)}<div data-blok style="margin:0 0 16px"><div style="font-weight:700;margin-bottom:6px">Ağız durumu</div>${agizSvg(k,TP.baski)}<div style="font-size:11px;color:#555;margin-top:6px">${Object.entries(KOSUL).map(([,v])=>v[1]+': '+v[0]).join(' · ')} · Turuncu nokta: planlı işlem</div></div>
    ${tbl(['Diş','İşlem','Hekim','Durum','Ücret'],k.plan.map(p=>[esc(p.dis||'—'),esc(p.ad),esc(p.hekim||''),p.durum==='yapildi'?'Yapıldı':'Planlandı',TL(p.fiyat)]),['','','','Toplam',TL(t)])}
    <p>Bu teklif düzenleme tarihinden itibaren 30 gün geçerlidir. Tedavi sırasında klinik bulgulara göre plan değişebilir; değişiklikler hastaya önceden bildirilir.</p>
    <div data-blok style="display:flex;gap:40px;margin-top:40px;flex-wrap:wrap">${imzaKutu('Hasta imzası<br>'+esc(k.ad),'')}${imzaKutu('Klinik / hekim imzası','')}</div></div>`}}
  if(tur==='odeme'){const op=k.odemePlan,v=vadeler(k);
    return {ad:`Odeme-plani-${k.ad}`,html:`<div style="${docCss}">${docHead('Ödeme Planı')}${docHasta(k)}
    <table style="font-size:13px;margin-bottom:10px"><tr><td style="padding:3px 20px 3px 0;color:#444">Tedavi tutarı</td><td style="text-align:right">${TL(op.toplam)}</td></tr><tr><td style="padding:3px 20px 3px 0;color:#444">İndirim</td><td style="text-align:right">${TL(op.indirim||0)}</td></tr><tr><td style="padding:3px 20px 3px 0;font-weight:700">Ödenecek toplam</td><td style="text-align:right;font-weight:700">${TL(borcToplam(k))}</td></tr></table>
    ${tbl(['','Vade','Tutar'],v.map(x=>[x.ad,tamTarih(x.vade),TL(x.tutar)]),['','Toplam',TL(v.reduce((s,x)=>s+x.tutar,0))])}
    <p>Taksitlerin vade tarihlerinde ödenmesi gerekir. Ödeme yapıldığında tahsilat makbuzu verilir; fatura ayrıca düzenlenir.</p>
    <div data-blok style="display:flex;gap:40px;margin-top:40px;flex-wrap:wrap">${imzaKutu('Hasta imzası<br>'+esc(k.ad),'')}${imzaKutu('Klinik yetkilisi imzası','')}</div></div>`}}
  if(tur==='recete'){const r=k.receteler.find(x=>x.id===id);const al=(k.anamnez&&k.anamnez.alerji)||'';

    <div style="font-size:28px;font-weight:700;margin:14px 0 10px;font-family:Georgia,serif">Rp/</div>
    ${r.ilaclar.map((i,n)=>`<div style="margin:0 0 16px 22px"><div style="font-weight:700">${n+1}. ${esc(i.ad)} <span style="font-weight:400">— ${i.kutu} kutu</span></div><div style="color:#333">Kullanım: ${esc(i.kullanim)}</div></div>`).join('')}
    <p style="color:#444;font-size:12px;margin-top:26px">Bu çıktı hastaya ilaç kullanım bilgisini vermek içindir. Resmî reçete gerektiğinde e-Reçete sistemi üzerinden düzenlenir.</p>
    <div data-blok style="display:flex;gap:40px;margin-top:40px;flex-wrap:wrap">${imzaKutu('Hekim kaşe / imza<br>'+esc(r.hekim),'')}</div></div>`}}
  if(tur==='lab'){const l=S.lab.find(x=>x.id===id);const kod=(k.ad||'').split(' ').filter(Boolean).map(s=>s[0]+'.').join(' ')+' · '+String(k.id||'').slice(0,4).toUpperCase();
    const sat=(a,b)=>`<tr><td style="padding:9px 0;color:#444;width:190px;border-bottom:1px solid #eee">${a}</td><td style="padding:9px 0;border-bottom:1px solid #eee;font-weight:600">${b}</td></tr>`;
    return {ad:`Lab-is-emri-${l.gonderim}`,html:`<div style="${docCss}">${docHead('Laboratuvar İş Emri')}<table style="width:100%;border-collapse:collapse;font-size:14px">${sat('Laboratuvar',esc(l.firma))}${sat('Hasta (kısaltılmış)',esc(kod))}${sat('Hekim',esc(l.hekim))}${sat('İş',esc(l.is))}${sat('Diş / bölge',esc(l.dis||'—'))}${sat('Renk',esc(l.renk||'—'))}${sat('Gönderim tarihi',tamTarih(l.gonderim))}${sat('İstenen teslim',tamTarih(l.beklenen))}${sat('Not',esc(l.not||'—'))}</table>
    <p style="color:#444;font-size:12px;margin-top:16px">Kişisel verilerin korunması için hastanın tam adı yerine kısaltma ve kayıt kodu yazılmıştır.</p>
    <div data-blok style="display:flex;gap:40px;margin-top:40px;flex-wrap:wrap">${imzaKutu('Hekim imzası<br>'+esc(l.hekim),'')}${imzaKutu('Teslim alan (laboratuvar)','')}</div></div>`}}
  if(tur==='rapor'){const {bas,bit}=aralik();const v=raporVeri(bas,bit);
    return {ad:`Klinik-raporu-${bas}-${bit}`,html:`<div style="${docCss}">${docHead('Klinik Raporu')}<p style="margin:0 0 14px"><b>Dönem:</b> ${tamTarih(bas)} – ${tamTarih(bit)}</p>${raporBaski(v)}</div>`}}
  if(tur==='hakedis'){const {bas,bit}=aralik();const hk=hakedisHesap(bas,bit);
    return {ad:`Hakedis-${bas}-${bit}`,html:`<div style="${docCss}">${docHead('Hekim Hakediş Raporu')}<p style="margin:0 0 10px"><b>Dönem:</b> ${tamTarih(bas)} – ${tamTarih(bit)}</p>${tbl(['Hekim','İşlem','Üretim','Lab maliyeti','Oran','Hakediş'],hk.map(x=>[esc(x.h),x.adet,TL(x.uretim),TL(x.lab),'%'+x.oran,TL(x.hakedis)]),['Toplam',sum(hk.map(x=>x.adet)),TL(sum(hk.map(x=>x.uretim))),TL(sum(hk.map(x=>x.lab))),'',TL(sum(hk.map(x=>x.hakedis)))])}<p style="color:#444;font-size:12px">Hesap: (dönemde yapılan tedavilerin tutarı − laboratuvar maliyeti) × hekim oranı.</p><div data-blok style="display:flex;gap:40px;margin-top:40px;flex-wrap:wrap">${imzaKutu('Hazırlayan','')}${imzaKutu('Onaylayan','')}</div></div>`}}
  if(tur==='protokol'){const {bas,bit}=aralik();const p=protokolListe(bas,bit);
    return {ad:`Protokol-defteri-${bas}-${bit}`,html:`<div style="${docCss}">${docHead('Protokol Defteri')}<p style="margin:0 0 10px"><b>Dönem:</b> ${tamTarih(bas)} – ${tamTarih(bit)} · ${p.length} kayıt</p>${tbl(['No','Tarih','Hasta','Yaş','Hekim','İşlem'],p.map(x=>[x.no,tamTarih(x.tarih)+' '+x.saat,esc(x.ad),x.yas===''?'—':x.yas,esc(x.hekim),esc(x.islem)]))}</div>`}}
  if(tur==='bakim'){const B=BAKIM[id];const ik=ok=>ok?'<svg width="18" height="18" viewBox="0 0 24 24" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="11" fill="#0E7A43"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="11" fill="#B42318"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';

async function kaydetDosya(ad,data){
  if(!DL){try{const bl=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(bl);const a=document.createElement('a');a.href=u;a.download=ad;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Dosya indirildi');return true}catch(e){toast('Bu görünümde dosya kaydedilemiyor');return false}}
  try{await DL.save({filename:ad,data});toast('Dosya kaydedildi');return true}catch(e){toast(e&&e.code==='declined'?'Kaydetme iptal edildi':'Dosya kaydedilemedi');return false}

function sayfala(root){const PH=1123,ust=48;const ro=root.getBoundingClientRect().top;root.querySelectorAll('[data-blok]').forEach(el=>{const b=el.getBoundingClientRect(),top=b.top-ro,h=b.height;const s0=Math.floor(top/PH),s1=Math.floor((top+h-1)/PH);
  if(s0!==s1&&h<PH-2*ust){const push=(s0+1)*PH-top+ust;if(el.tagName==='TR')el.querySelectorAll('td').forEach(td=>td.style.paddingTop=(parseFloat(getComputedStyle(td).paddingTop)||0)+push+'px');else el.style.marginTop=(parseFloat(getComputedStyle(el).marginTop)||0)+push+'px'}})}
async function pdfYap(){
  const B=U.belge;if(!B)return;const k=kisi(B.kid),b=belgeHTML(B.tur,k,B.id);
  if(!window.html2canvas||!window.jspdf){toast('PDF aracı yüklenemedi; HTML olarak kaydedin');return}
  toast('PDF hazırlanıyor…');
  const r=document.getElementById('render');r.innerHTML=b.html;sayfala(r.firstElementChild);
  try{
    const c=await html2canvas(r.firstElementChild,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'p'});
    const pw=210,ph=297,pxPerMm=c.width/pw,pagePx=Math.floor(ph*pxPerMm);
    for(let y=0,i=0;y<c.height;y+=pagePx,i++){
      const sl=document.createElement('canvas');sl.width=c.width;sl.height=Math.min(pagePx,c.height-y);
      sl.getContext('2d').drawImage(c,0,y,c.width,sl.height,0,0,c.width,sl.height);
      if(i)pdf.addPage();pdf.addImage(sl.toDataURL('image/jpeg',.92),'JPEG',0,0,pw,sl.height/pxPerMm);
    }
    r.innerHTML='';await kaydetDosya(dosyaAdi(b.ad)+'.pdf',pdf.output('arraybuffer'));
  }catch(e){r.innerHTML='';toast('PDF oluşturulamadı; HTML olarak kaydedin')}
}

  if(tur==='tekrar')return tekrarAdaylar().map(r=>{const k=kisi(r.kisiId),key='r:'+r.id+':'+((r.hatN||1)+1);return{key,rid:r.id,ad:k.ad,alt:kisa(r.tarih)+' '+r.saat+' · '+(r.hatN||1)+' hatırlatmaya yanıt yok',href:waLink(k.tel,hatMesaj(r,k)),done:!!S.mesaj[key]}});
  if(tur==='gelmedi')return S.randevular.filter(r=>r.durum==='gelmedi'&&r.tarih>=addDays(TODAY,-3)&&!r.kapandi&&!sonraki(r.kisiId)).map(r=>{const k=kisi(r.kisiId);return{key:'g:'+r.id,ad:k.ad,alt:'Gelmedi · '+kisa(r.tarih),href:waLink(k.tel,doldur(S.ayar.tplYeni,r,k)),done:!!M['g:'+r.id]}});
  if(tur==='taksit')return gecikenler().map(({k,v})=>{const key='t:'+k.id+':'+v.vade;return{key,ad:k.ad,alt:v.ad+' · '+TL(v.kalan),href:waLink(k.tel,doldur(S.ayar.tplOdeme,null,k,{vade:tamTarih(v.vade),tutar:TL(v.kalan)})),done:!!M[key]&&gunFark(M[key],TODAY)<7}});
  if(tur==='kontrol')return lKontrol().filter(k=>izinDurum(k)[0]==='var').slice(0,15).map(k=>{const key='k:'+k.id;return{key,ad:k.ad,alt:'Son geliş '+kisaYil(sonGelis(k.id)),href:waLink(k.tel,doldur(S.ayar.tplKontrol,null,k)),done:!!M[key]&&gunFark(M[key],TODAY)<60}});

function disTip(no){const n=Number(no),d=n%10,sut=n>50;if(d<=2)return'kesici';if(d===3)return'kopek';if(sut)return'azi';return d>=6?'azi':'kucukazi'}
function disSvg(no,d,P,o){o=o||{};d=d||[];const t=DIS_SEKIL[disTip(no)],q=Math.floor(Number(no)/10),alt=[3,4,7,8].includes(q);
  const eks=d.includes('eksik'),imp=d.includes('implant'),kr=d.includes('kron');let g='';

  else g+=t.roots.map(p=>`<path d="${p}" fill="${P.root}" stroke="${P.st}" stroke-width="1.2"/>`).join('');
  if(d.includes('kanal')&&!imp)g+=t.kanal.map(([a,b,c,e])=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${e}" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>`).join('');

  const body=`<g${eks?' opacity=".2"':''}>${g}</g>${eks?`<path d="${t.crown}" fill="none" stroke="${P.st}" stroke-dasharray="3 3" stroke-width="1.4"/>`:''}`;
  const inner=alt?`<g transform="translate(0,80) scale(1,-1)">${body}</g>`:body;
  return o.ham?inner:`<svg viewBox="0 0 40 80" width="${o.w||30}" height="${(o.w||30)*2}" aria-hidden="true" focusable="false">${inner}</svg>`}
function agizSvg(k,P,sut){const u=sut?SUST:UST,a=sut?SALT:ALT,W=u.length*40,H=204;let s='';

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diş şeması: ${esc(Object.entries(k.disler).filter(([,v])=>v.length).map(([n,v])=>n+' '+v.map(x=>KOSUL[x][0]).join('/')).join(', ')||'işaretli diş yok')}" font-family="Figtree, Arial, sans-serif" style="width:100%;height:auto;display:block"><line x1="${W/2}" x2="${W/2}" y1="14" y2="${H-14}" stroke="${P.st}" stroke-dasharray="3 3" stroke-width="1"/><line x1="0" x2="${W}" y1="102" y2="102" stroke="${P.st}" stroke-dasharray="3 3" stroke-width="1"/>${s}</svg>`}

function karsilastir(){const k=kisi(U.hasta),G=k.goruntuler.slice().sort((a,b)=>a.tarih.localeCompare(b.tarih));if(G.length<2)return;
  if(!U.kr||!G.some(g=>g.id===U.kr.a)||!G.some(g=>g.id===U.kr.b))U.kr={a:G[0].id,b:G[G.length-1].id,mod:'kaydir'};

function vStok(){const l=S.stok.slice().sort((a,b)=>(a.miktar<=a.kritik?0:1)-(b.miktar<=b.kritik?0:1)||a.ad.localeCompare(b.ad,'tr'));

/* ---------- Raporlar ---------- */
function aralik(){const t=parse(TODAY);let bas;if(U.rap==='yil')bas=iso(new Date(t.getFullYear(),0,1));else{const n={'3ay':3,'6ay':6,'12ay':12}[U.rap]||12;bas=iso(new Date(t.getFullYear(),t.getMonth()-n+1,1))}return{bas,bit:TODAY}}
function aylar(bas,bit){const o=[];const d=parse(bas);d.setDate(1);const e=parse(bit);while(d<=e){o.push(d.getFullYear()+'-'+pad(d.getMonth()+1));d.setMonth(d.getMonth()+1)}return o}
const ayAd=m=>{const[y,mm]=m.split('-');return AY[Number(mm)-1]+(mm==='01'?" '"+y.slice(2):'')};
function topN(a,n){a.sort((x,y)=>y.v-x.v);if(a.length<=n)return a;const r=a.slice(0,n);r.push({ad:'Diğer',v:sum(a.slice(n).map(x=>x.v))});return r}
function hakedisHesap(bas,bit){return S.ayar.hekimler.map(h=>{const isl=S.kisiler.flatMap(k=>k.plan.filter(p=>p.durum==='yapildi'&&p.hekim===h&&p.tarih&&p.tarih>=bas&&p.tarih<=bit));
  const uretim=sum(isl.map(p=>p.fiyat)),lab=sum(S.lab.filter(l=>l.hekim===h&&l.gonderim>=bas&&l.gonderim<=bit).map(l=>l.ucret)),oran=Number(S.ayar.hakedis[h]??40);
  return{h,adet:isl.length,uretim,lab,oran,hakedis:yuvarla(Math.max(0,uretim-lab)*oran/100)}})}
function protokolListe(bas,bit){return sirala(S.randevular.filter(x=>x.durum==='cikti'&&x.tarih>=bas&&x.tarih<=bit)).map((x,i)=>{const k=kisi(x.kisiId);const isl=k.plan.filter(p=>p.tarih===x.tarih&&p.durum==='yapildi').map(p=>p.ad).join(', ');return{no:i+1,tarih:x.tarih,saat:x.saat,ad:k.ad,yas:k.dogum?yas(k.dogum):'',hekim:x.hekim,islem:isl||'Muayene / kontrol'}})}
function raporVeri(bas,bit){const inR=d=>d&&d>=bas&&d<=bit,ay=aylar(bas,bit);
  const th=S.kisiler.flatMap(k=>k.tahsilat).filter(t=>inR(t.tarih)),gd=S.giderler.filter(g=>inR(g.tarih));
  const tAy=ay.map(m=>sum(th.filter(t=>t.tarih.startsWith(m)).map(t=>t.tutar))),gAy=ay.map(m=>sum(gd.filter(g=>g.tarih.startsWith(m)).map(g=>g.tutar)));
  const rv=S.randevular.filter(r=>inR(r.tarih)&&r.tarih<TODAY&&(r.durum==='cikti'||r.durum==='gelmedi'));
  const gmAy=ay.map(m=>{const x=rv.filter(r=>r.tarih.startsWith(m));return x.length?Math.round(x.filter(r=>r.durum==='gelmedi').length/x.length*1000)/10:0});
  const isl={};S.kisiler.forEach(k=>k.plan.forEach(p=>{if(p.durum==='yapildi'&&inR(p.tarih))isl[p.ad]=(isl[p.ad]||0)+1}));
  const yeni=S.kisiler.filter(k=>inR(k.kayit)),ky={};yeni.forEach(k=>{const a=k.kaynak||'Belirtilmemiş';ky[a]=(ky[a]||0)+1});
  const hk=hakedisHesap(bas,bit);
  return{bas,bit,ay,tAy,gAy,gmAy,gm:rv.length?Math.round(rv.filter(r=>r.durum==='gelmedi').length/rv.length*1000)/10:0,rvSay:rv.length,
    islem:topN(Object.entries(isl).map(([ad,v])=>({ad,v})),7),hk,kaynak:Object.entries(ky).map(([ad,v])=>({ad,v})).sort((a,b)=>b.v-a.v),
    yontem:YONTEM.map(y=>({ad:y,v:sum(th.filter(t=>t.yontem===y).map(t=>t.tutar))})),gelir:sum(tAy),gider:sum(gAy),yeni:yeni.length,alacak:sum(S.kisiler.map(k=>Math.max(0,kalan(k))))}}
const PAL={ekran:{s1:'var(--s1)',s2:'var(--s2)',grid:'var(--grid)',axis:'var(--axis)',ink:'var(--fg)',surf:'var(--surface)',baski:false},baski:{s1:'#2a78d6',s2:'#eb6834',grid:'#E3EAE9',axis:'#52514e',ink:'#111111',surf:'#ffffff',baski:true}};
const kisaTL=n=>{n=Number(n)||0;const a=Math.abs(n);return (a>=1e6?(n/1e6).toLocaleString('tr-TR',{maximumFractionDigits:1})+' mn':a>=1e3?Math.round(n/1e3).toLocaleString('tr-TR')+' bin':Math.round(n).toLocaleString('tr-TR'))+' ₺'};
const yuzde=n=>'%'+(Math.round(n*10)/10).toLocaleString('tr-TR');
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p}
function vBar(x,y,w,h,r,f){if(h<=0.5)return'';r=Math.min(r,w/2,h);return `<path d="M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z" fill="${f}"/>`}
function hBar(x,y,w,h,r,f){if(w<=0.5)return'';r=Math.min(r,h/2,w);return `<path d="M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z" fill="${f}"/>`}
const hit=(x,y,w,h,tip)=>`<rect class="hit" x="${x}" y="${y}" width="${w}" height="${h}" tabindex="0" data-tip="${esc(tip)}"/>`;
function grid(P,ml,mr,mt,ih,W,mx,fmt){let g='';for(let i=0;i<=4;i++){const y=mt+ih-ih*i/4;g+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="${P.grid}" stroke-width="1"/><text x="${ml-6}" y="${y+4}" text-anchor="end" font-size="11" fill="${P.axis}">${fmt(mx*i/4)}</text>`}return g}
function cizSutun({etiket,seri,fmt,tipFmt,P,ad}){const W=640,Hh=240,ml=62,mr=8,mt=14,mb=28,iw=W-ml-mr,ih=Hh-mt-mb,n=etiket.length,band=iw/n,ns=seri.length;
  const mx=niceMax(Math.max(1,...seri.flatMap(s=>s.d)));const bw=Math.max(4,Math.min(24,(band*.72-(ns-1)*2)/ns));let m='',h='';
  etiket.forEach((e,i)=>{const cx=ml+band*i+band/2,gw=ns*bw+(ns-1)*2;let x=cx-gw/2;seri.forEach(s=>{const hh=ih*s.d[i]/mx;m+=vBar(x,mt+ih-hh,bw,hh,4,s.renk);x+=bw+2});
    if(n<=13||i%2===0)m+=`<text x="${cx}" y="${Hh-8}" text-anchor="middle" font-size="11" fill="${P.axis}">${esc(e)}</text>`;
    h+=hit(ml+band*i,mt,band,ih,e+' — '+seri.map(s=>s.ad+': '+tipFmt(s.d[i])).join(' · '))});
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(ad)}" font-family="Figtree, Arial, sans-serif">${grid(P,ml,mr,mt,ih,W,mx,fmt)}<line x1="${ml}" x2="${W-mr}" y1="${mt+ih}" y2="${mt+ih}" stroke="${P.axis}" stroke-width="1"/>${m}${P.baski?'':h}</svg>`}
function cizCizgi({etiket,d,fmt,P,ad,renk}){const W=640,Hh=220,ml=52,mr=24,mt=18,mb=28,iw=W-ml-mr,ih=Hh-mt-mb,n=etiket.length;
  const mx=niceMax(Math.max(1,...d)),X=i=>ml+(n>1?iw*i/(n-1):iw/2),Y=v=>mt+ih-ih*v/mx;
  const pts=d.map((v,i)=>[X(i),Y(v)]);const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('');
  const area=line+`L${pts[pts.length-1][0].toFixed(1)},${mt+ih}L${pts[0][0].toFixed(1)},${mt+ih}Z`;const L=pts[pts.length-1];
  let lab='',h='';etiket.forEach((e,i)=>{if(n<=13||i%2===0)lab+=`<text x="${X(i)}" y="${Hh-8}" text-anchor="middle" font-size="11" fill="${P.axis}">${esc(e)}</text>`;const bw=n>1?iw/(n-1):iw,x0=Math.max(ml,X(i)-bw/2),x1=Math.min(W-mr,X(i)+bw/2);h+=hit(x0,mt,x1-x0,ih,e+' — '+fmt(d[i]))});
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(ad)}" font-family="Figtree, Arial, sans-serif">${grid(P,ml,mr,mt,ih,W,mx,fmt)}<line x1="${ml}" x2="${W-mr}" y1="${mt+ih}" y2="${mt+ih}" stroke="${P.axis}" stroke-width="1"/>${lab}<path d="${area}" fill="${renk}" fill-opacity=".1"/><path d="${line}" fill="none" stroke="${renk}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${L[0]}" cy="${L[1]}" r="4.5" fill="${renk}" stroke="${P.surf}" stroke-width="2"/><text x="${Math.min(L[0],W-mr-2)}" y="${L[1]-10}" text-anchor="end" font-size="12" font-weight="700" fill="${P.ink}">${esc(fmt(d[d.length-1]))}</text>${P.baski?'':h}</svg>`}
function cizYatay({items,renk,fmt,P,ad}){const W=640,rh=32,lw=186,rw=W-lw-96,Hh=items.length*rh+6,mx=Math.max(1,...items.map(i=>i.v));let s='';
  items.forEach((it,i)=>{const y=3+i*rh,w=rw*it.v/mx;s+=`<text x="${lw-10}" y="${y+rh/2+4}" text-anchor="end" font-size="12" fill="${P.ink}">${esc(kes(it.ad,28))}</text>`+hBar(lw,y+7,w,18,4,renk)+(i===0||P.baski?`<text x="${lw+w+6}" y="${y+rh/2+4}" font-size="12" fill="${P.axis}">${esc(fmt(it.v))}</text>`:'')+(P.baski?'':hit(0,y,W,rh,it.ad+': '+fmt(it.v)))});
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(ad)}" font-family="Figtree, Arial, sans-serif"><line x1="${lw}" x2="${lw}" y1="0" y2="${Hh}" stroke="${P.axis}" stroke-width="1"/>${s}</svg>`}
const sayi=n=>Math.round(n).toLocaleString('tr-TR');
function grafikler(v,P){const bos=a=>!a.some(x=>(x.v!==undefined?x.v:x)>0);
  const et=v.ay.map(ayAd);
  return [
    {id:'gelirgider',t:'Aylık tahsilat ve gider',alt:'Kasaya giren ödemeler ile kaydedilen giderler, aynı ölçekte.',leg:[['Tahsilat',P.s1],['Gider',P.s2]],
     svg:bos(v.tAy.concat(v.gAy))?'':cizSutun({etiket:et,seri:[{ad:'Tahsilat',renk:P.s1,d:v.tAy},{ad:'Gider',renk:P.s2,d:v.gAy}],fmt:kisaTL,tipFmt:TL,P,ad:'Aylık tahsilat ve gider'}),
     tbl:[['Ay','Tahsilat','Gider','Fark'],v.ay.map((m,i)=>[ayAd(m)+' '+m.slice(0,4),TL(v.tAy[i]),TL(v.gAy[i]),TL(v.tAy[i]-v.gAy[i])])]},
    {id:'gelmeme',t:'Randevuya gelmeme oranı',alt:`Geçmiş randevulardan gelinmeyenlerin payı. Dönem ortalaması ${yuzde(v.gm)} (${sayi(v.rvSay)} randevu).`,
     svg:v.rvSay?cizCizgi({etiket:et,d:v.gmAy,fmt:yuzde,P,ad:'Aylık gelmeme oranı',renk:P.s1}):'',tbl:[['Ay','Gelmeme oranı'],v.ay.map((m,i)=>[ayAd(m)+' '+m.slice(0,4),yuzde(v.gmAy[i])])]},
    {id:'islem',t:'En çok yapılan işlemler',alt:'Dönemde "yapıldı" işaretlenen tedaviler, adet.',svg:bos(v.islem)?'':cizYatay({items:v.islem,renk:P.s1,fmt:x=>sayi(x)+' adet',P,ad:'En çok yapılan işlemler'}),tbl:[['İşlem','Adet'],v.islem.map(x=>[esc(x.ad),sayi(x.v)])]},
    {id:'hekim',t:'Hekime göre üretim',alt:'Hekimin yaptığı tedavilerin toplam tutarı.',svg:bos(v.hk.map(x=>x.uretim))?'':cizYatay({items:v.hk.map(x=>({ad:x.h,v:x.uretim})).sort((a,b)=>b.v-a.v),renk:P.s1,fmt:kisaTL,P,ad:'Hekime göre üretim'}),tbl:[['Hekim','Üretim','Hakediş'],v.hk.map(x=>[esc(x.h),TL(x.uretim),TL(x.hakedis)])]},
    {id:'kaynak',t:'Yeni hastalar nereden geldi',alt:`Dönemde kaydı açılan ${sayi(v.yeni)} hastanın geliş kaynağı.`,svg:bos(v.kaynak)?'':cizYatay({items:v.kaynak,renk:P.s1,fmt:x=>sayi(x)+' hasta',P,ad:'Yeni hasta kaynakları'}),tbl:[['Kaynak','Hasta'],v.kaynak.map(x=>[esc(x.ad),sayi(x.v)])]},
    {id:'yontem',t:'Ödeme yöntemleri',alt:'Dönemdeki tahsilatın ödeme yöntemine göre dağılımı.',svg:bos(v.yontem)?'':cizYatay({items:v.yontem.slice().sort((a,b)=>b.v-a.v),renk:P.s1,fmt:kisaTL,P,ad:'Ödeme yöntemleri'}),tbl:[['Yöntem','Tutar'],v.yontem.map(x=>[x.ad,TL(x.v)])]}
  ]}
function ozetTiles(v){return [['Tahsilat',TL(v.gelir),''],['Gider',TL(v.gider),''],['Net',TL(v.gelir-v.gider),v.gelir-v.gider<0?'var(--bad)':''],['Yeni hasta',sayi(v.yeni),''],['Gelmeme oranı',yuzde(v.gm),v.gm>10?'var(--warn)':''],['Açık alacak (bugün)',TL(v.alacak),'']]}
function raporEkran(v){const P=PAL.ekran;

function vRaporlar(){const {bas,bit}=aralik();
